<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabby — Checkout</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/icon.png">
<style>
:root{--bg:#F7F7F8;--panel:#FFFFFF;--text:#1B1C1F;--muted:#5B5E66;--line:#E4E4E7;--accent:#4F46E5}
@media (prefers-color-scheme: dark){:root{--bg:#111214;--panel:#18191C;--text:#ECEDEF;--muted:#A0A4AD;--line:#2C2E33;--accent:#9AA0FF}}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:720px;margin:0 auto;padding:48px 16px 80px}
h1{font-size:32px;letter-spacing:-.02em;margin:0 0 4px}h2{font-size:19px;margin:32px 0 8px}
p,li{color:var(--text)}.muted{color:var(--muted)}a{color:var(--accent)}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}th{border-top:0;font-weight:600}
code{font-size:14px}
nav.top{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:32px;font-size:15px}nav.top a{text-decoration:none}
footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
</style>
<style>.btn{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:8px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--text);background:var(--panel);cursor:pointer;font-family:inherit;font-size:inherit}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.key{font:600 20px ui-monospace,monospace;letter-spacing:.04em;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:inline-block}</style>
</head>
<body>
<main>
<nav class="top" aria-label="Site"><a href="index.html"><strong>Tabby</strong></a><a href="index.html#pricing">Pricing</a><a href="terms.html">Terms</a><a href="refund.html">Refunds</a><a href="privacy.html">Privacy</a></nav>
<h1>Get Tabby Pro</h1>
<p id="msg" class="muted">Opening secure checkout…</p>
<p class="muted">Payments are processed by our reseller Creem (creem.io), the Merchant of Record. 30-day money-back guarantee.</p>
<p><button id="open" class="btn primary" type="button" hidden>Open checkout</button></p>
<footer>Tabby is made by Nguyen Huu Tai · Contact: <a href="mailto:tainh.work@gmail.com">tainh.work@gmail.com</a> · <a href="terms.html">Terms</a> · <a href="refund.html">Refunds</a> · <a href="privacy.html">Privacy</a></footer>
</main>
<script src="pay-config.js"></script>
<script>
// Opened from Tabby's Pro page: ?plan=monthly|yearly|founding&install=<random install id>.
// The license server creates a Creem checkout for this install and we go there.
(() => {
  const q = new URLSearchParams(location.search);
  const plan = q.get('plan') || 'monthly';
  const install = q.get('install') || '';
  const msg = document.getElementById('msg');
  const btn = document.getElementById('open');
  const go = () => {
    msg.textContent = 'Opening secure checkout…';
    fetch(`${TABBY_PAY.licenseApi}/checkout`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ plan, install }),
    })
      .then((r) => r.json())
      .then((d) => {
        if (d.url) return location.assign(d.url);
        msg.textContent =
          d.error === 'sold-out'
            ? 'Founding member is sold out. Pro is still available monthly or yearly.'
            : d.error === 'closed'
              ? 'Paid plans open soon. Until then, every new install gets a free 14-day Pro trial.'
              : 'Checkout could not open. Please try again in a moment.';
        btn.hidden = d.error === 'sold-out' || d.error === 'closed';
      })
      .catch(() => {
        msg.textContent = 'Checkout could not open. Check your connection and try again.';
        btn.hidden = false;
      });
  };
  btn.onclick = go;
  go();
})();
</script>
</body>
</html>
